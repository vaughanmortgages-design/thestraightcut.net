name: Build approved deals feed

on:
  push:
    branches: [main]
    paths:
      - 'data/approved/**'
      - 'scripts/build-deals.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build feed
        run: node scripts/build-deals.mjs
      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/deals.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deals.json
          git commit -m "Update approved deals feed"
          git push
