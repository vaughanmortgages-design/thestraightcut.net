name: Publish Daily Draft Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-daily-draft-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send draft test payload
        env:
          CONTENT_STUDIO_WEBHOOK_URL: ${{ secrets.CONTENT_STUDIO_WEBHOOK_URL }}
        run: |
          if [ -z "$CONTENT_STUDIO_WEBHOOK_URL" ]; then
            echo "::error::CONTENT_STUDIO_WEBHOOK_URL is not configured"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data @- \
            "$CONTENT_STUDIO_WEBHOOK_URL" <<'JSON'
          {
            "brand": "straightcut",
            "site": "thestraightcut.net",
            "category": "Pets",
            "title": "Rocky Mountain Dog Pet Gear Test",
            "summary": "Test draft for The Straight Cut Pets department.",
            "article": "This is a test payload for The Straight Cut Pets content automation.",
            "image": "https://placehold.co/1080x1350/png",
            "status": "Draft",
            "affiliateName": "Rocky Mountain Dog",
            "affiliateUrl": "https://rockymountaindog.ca/discount/RAYCUTTER10?ref=mcwboquj",
            "couponCode": "RAYCUTTER10",
            "timestamp": "${{ github.run_id }}"
          }
          JSON
